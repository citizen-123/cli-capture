name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether the change set can affect the built binary. Kept as a
  # separate job rather than a `paths-ignore:` trigger so that `build-test`
  # always reports a status: a workflow that never starts leaves a required
  # check pending forever, while a skipped job counts as passing.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a build is needed
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Paths that cannot change the binary or its test results. A change
          # set touching only these skips the build; everything else builds, so
          # new source, tooling, or workflow files are covered without editing
          # this list.
          DOC_ONLY=(
            'docs/*'
            '*.md'
            'LICENSE'
            '.github/ISSUE_TEMPLATE/*'
          )

          decide() {
            echo "$2"
            echo "build=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            decide true "No base commit to diff against — building."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            decide true "Base commit $BASE_SHA is unreachable — building."
          fi

          # The base branch may have moved on since the branch was cut, so diff
          # from the merge base to consider only this branch's own changes.
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")"
          files="$(git diff --name-only "$base" "$HEAD_SHA")"

          if [ -z "$files" ]; then
            decide false "No files changed — skipping the build."
          fi

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            for pattern in "${DOC_ONLY[@]}"; do
              # shellcheck disable=SC2053 # unquoted RHS is the glob to match
              if [[ $file == $pattern ]]; then
                continue 2
              fi
            done
            decide true "$file requires a build."
          done <<< "$files"

          decide false "Documentation-only change — skipping the build."

  build-test:
    name: build-test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
