name: release

on:
  push:
    tags:
      - "v*"
  # Escape hatch: release a tag that the filter below decided to skip, or
  # re-release one after a failed run. Actions → release → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (forces a release even if the tag is documentation-only)"
        required: true

permissions:
  contents: write

jobs:
  # Tag pushes can't be filtered with `paths:` — GitHub ignores path filters on
  # tag events — so the same documentation-only check runs as a gate job here.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Decide whether this tag needs a release build
        id: filter
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ "$FORCED" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for $TAG — releasing."
            exit 0
          fi

          git fetch --tags --force --quiet origin 2>/dev/null || true
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no previous tag to compare against — releasing."
            exit 0
          fi

          echo "Comparing $prev..$TAG"
          release="$(.github/scripts/needs-build.sh "$prev" "$TAG")"
          echo "release=$release" >> "$GITHUB_OUTPUT"

          # A skipped release is a tag with no binaries behind it, so say so
          # loudly rather than leaving a silently green run.
          if [ "$release" = "false" ]; then
            echo "::warning title=Release skipped::$TAG only changes documentation since $prev — no binaries were published."
            {
              echo "### Release skipped"
              echo
              echo "\`$TAG\` only changes documentation since \`$prev\`, so no binaries,"
              echo "checksums, or Homebrew cask update were published for it."
              echo
              echo "To release it anyway: **Actions → release → Run workflow**, tag \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  goreleaser:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token that can push the formula to citizen-123/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
