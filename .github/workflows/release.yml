name: release

on:
  push:
    tags:
      - "v*"
  # Re-release a verified tag after a failed run or when it otherwise changes
  # only documentation. Actions → release → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (without refs/tags/)"
        required: true

permissions:
  contents: read

jobs:
  # Tag pushes can't be filtered with `paths:` — GitHub ignores path filters on
  # tag events — so the same documentation-only check runs as a gate job here.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      ref: ${{ steps.verify-tag.outputs.ref }}
      tag: ${{ steps.verify-tag.outputs.tag }}
      sha: ${{ steps.verify-tag.outputs.sha }}
    steps:
      - name: Verify release tag
        id: verify-tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          ref="$EVENT_REF"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_TAG" in
              v*) ref="refs/tags/$DISPATCH_TAG" ;;
              *) echo "::error::Manual release input must name a v* tag, not a branch or ref."; exit 1 ;;
            esac
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *) echo "::error::Release ref must be a refs/tags/v* tag."; exit 1 ;;
          esac
          if ! git check-ref-format --allow-onelevel "$ref"; then
            echo "::error::Release ref is not a valid tag ref: $ref"
            exit 1
          fi

          remote="$SERVER_URL/$REPOSITORY.git"
          verified="$(git ls-remote --refs "$remote" "$ref")"
          if [ -z "$verified" ] || [ "$(printf '%s\n' "$verified" | wc -l)" -ne 1 ]; then
            echo "::error::Release tag does not exist exactly once: $ref"
            exit 1
          fi
          IFS=$'\t' read -r tag_object found_ref <<EOF
          $verified
          EOF
          if [ "$found_ref" != "$ref" ]; then
            echo "::error::Release tag lookup resolved an unexpected ref: $found_ref"
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          git init --quiet "$verify_dir"
          git -C "$verify_dir" remote add origin "$remote"
          git -C "$verify_dir" fetch --no-tags --depth=1 origin "$ref:refs/tags/verified-release-tag"
          fetched_object="$(git -C "$verify_dir" rev-parse --verify refs/tags/verified-release-tag)"
          if [ "$fetched_object" != "$tag_object" ]; then
            echo "::error::Release tag changed while it was being verified: $ref"
            exit 1
          fi
          sha="$(git -C "$verify_dir" rev-parse --verify 'refs/tags/verified-release-tag^{commit}')"

          tag="${ref#refs/tags/}"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verified release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.verify-tag.outputs.sha }}
          fetch-depth: 0

      - name: Restore verified tag reference
        env:
          TAG: ${{ steps.verify-tag.outputs.tag }}
          SHA: ${{ steps.verify-tag.outputs.sha }}
        run: git tag --force "$TAG" "$SHA"

      - name: Decide whether this tag needs a release build
        id: filter
        env:
          TAG: ${{ steps.verify-tag.outputs.tag }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ "$FORCED" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for $TAG — releasing."
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no previous tag to compare against — releasing."
            exit 0
          fi

          echo "Comparing $prev..$TAG"
          release="$(.github/scripts/needs-build.sh "$prev" "$TAG")"
          echo "release=$release" >> "$GITHUB_OUTPUT"

          # A skipped release is a tag with no binaries behind it, so say so
          # loudly rather than leaving a silently green run.
          if [ "$release" = "false" ]; then
            echo "::warning title=Release skipped::$TAG only changes documentation since $prev — no binaries were published."
            {
              echo "### Release skipped"
              echo
              echo "\`$TAG\` only changes documentation since \`$prev\`, so no binaries,"
              echo "checksums, or Homebrew cask update were published for it."
              echo
              echo "To release it anyway: **Actions → release → Run workflow**, tag \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  goreleaser:
    needs: changes
    # Same fail-open rule as ci.yml: only an explicit "false" skips. A tag that
    # the filter couldn't evaluate still gets its binaries.
    if: ${{ !cancelled() && needs.changes.outputs.release != 'false' }}
    runs-on: ubuntu-latest
    # The publishing job alone receives release, provenance, and OIDC grants.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.changes.outputs.sha }}
          fetch-depth: 0

      - name: Restore verified tag reference
        env:
          TAG: ${{ needs.changes.outputs.tag }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: git tag --force "$TAG" "$SHA"

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.3"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token that can push the formula to citizen-123/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest release archives and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/**/*.tar.gz
            dist/**/*.zip
