# GoReleaser configuration — https://goreleaser.com
# Cuts cross-platform release binaries + checksums on every `v*` tag.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cli-capture
    main: ./cmd/cli-capture
    binary: cli-capture
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    # Windows gets a .zip instead of a tarball.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Publish a Homebrew cask to citizen-123/homebrew-tap on every release.
# (GoReleaser deprecated formula `brews` in favour of `homebrew_casks`; casks
# are macOS-only — Linux users install via `go install` or the release binaries.)
# Needs a token that can push to that repo — supplied via the
# HOMEBREW_TAP_GITHUB_TOKEN secret in the release workflow (the default
# GITHUB_TOKEN can't write to a different repository).
homebrew_casks:
  - name: cli-capture
    repository:
      owner: citizen-123
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: citizen-123
      email: citizen-123@users.noreply.github.com
    homepage: "https://github.com/citizen-123/cli-capture"
    description: "Burp Suite, but for CLI/TUI apps — capture, inspect, and tamper with a target program's network traffic"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
